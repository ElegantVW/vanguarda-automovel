[package]
name = "vanguarda-diagnostico"
version = "0.1.0"
edition = "2021"
description = "Vanguarda — OBD/UDS público no vLinker FS. Sem bases FORScan/Autocom."
license = "UNLICENSED"

[lib]
name = "vanguarda_diagnostico"
path = "src/lib.rs"

[[bin]]
name = "vanguarda-scan"
path = "src/bin/scan.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serialport = "4"
